<svg width="720" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <rect x="0" y="0" width="720" height="1" fill="#e4e4e7"/>
  <rect x="0" y="399" width="720" height="1" fill="#e4e4e7"/>

  <defs>
    <clipPath id="funnel">
      <polygon points="130,60 650,60 560,360 220,360"/>
    </clipPath>
  </defs>

  <!-- Column headers -->
  <text x="260" y="40" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="0.05em">HUMAN EXPERIENCE</text>
  <text x="520" y="40" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="0.05em">AGENT EXPERIENCE</text>

  <!-- Fills -->
  <polygon points="130,60 390,60 390,360 220,360" fill="#f4f4f5"/>
  <polygon points="390,60 650,60 560,360 390,360" fill="#4f46e5" fill-opacity="0.06"/>

  <!-- Dividers clipped to funnel -->
  <g clip-path="url(#funnel)">
    <line x1="0" y1="120" x2="720" y2="120" stroke="#e4e4e7" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="720" y2="180" stroke="#e4e4e7" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="720" y2="240" stroke="#e4e4e7" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="720" y2="300" stroke="#e4e4e7" stroke-width="0.5"/>
    <line x1="390" y1="60" x2="390" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  </g>

  <!-- Funnel outline: left side -->
  <line x1="130" y1="60" x2="220" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="130" y1="60" x2="390" y2="60" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="220" y1="360" x2="390" y2="360" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Funnel outline: right side -->
  <line x1="390" y1="60" x2="650" y2="60" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="650" y1="60" x2="560" y2="360" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="560" y1="360" x2="390" y2="360" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Stage labels -->
  <text x="20" y="94" font-size="13" font-weight="600" fill="#0a0a0a">Discovery</text>
  <text x="20" y="154" font-size="13" font-weight="600" fill="#0a0a0a">Acquisition</text>
  <text x="20" y="214" font-size="13" font-weight="600" fill="#0a0a0a">Activation</text>
  <text x="20" y="274" font-size="13" font-weight="600" fill="#0a0a0a">Conversion</text>
  <text x="20" y="334" font-size="13" font-weight="600" fill="#0a0a0a">Retention</text>

  <!-- Human experience text -->
  <text x="260" y="94" font-size="10.5" fill="#666666" text-anchor="middle">SEO, ads, content marketing</text>
  <text x="270" y="154" font-size="10.5" fill="#666666" text-anchor="middle">Sign-up form, email verify, CAPTCHA</text>
  <text x="280" y="214" font-size="10.5" fill="#666666" text-anchor="middle">Dashboard onboarding, email loops</text>
  <text x="292" y="274" font-size="10.5" fill="#666666" text-anchor="middle">Credit card forms, pricing page</text>
  <text x="302" y="334" font-size="10.5" fill="#666666" text-anchor="middle">Support tickets, dashboard usage</text>

  <!-- Agent experience text -->
  <text x="514" y="94" font-size="10.5" fill="#4f46e5" text-anchor="middle">llms.txt, agents.json, metadata</text>
  <text x="504" y="154" font-size="10.5" fill="#4f46e5" text-anchor="middle">POST /signup → API key</text>
  <text x="492" y="214" font-size="10.5" fill="#4f46e5" text-anchor="middle">Programmatic onboarding, MCP servers</text>
  <text x="482" y="274" font-size="10.5" fill="#4f46e5" text-anchor="middle">Stripe API, saved payment method</text>
  <text x="472" y="334" font-size="10.5" fill="#4f46e5" text-anchor="middle">Usage APIs, self-management via API</text>

  <!-- Attribution -->
  <text x="680" y="385" font-size="11" fill="#9ca3af" text-anchor="end">katrinalaszlo.com</text>
</svg>
